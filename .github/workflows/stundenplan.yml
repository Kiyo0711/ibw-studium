name: Stundenplan aktualisieren

on:
  schedule:
    - cron: '23 3 * * *'   # jede Nacht
  workflow_dispatch:        # Knopf "Run workflow" auf GitHub
  push:
    branches: [main]
    paths: ['stundenplan-url.txt', '.github/workflows/stundenplan.yml']

permissions:
  contents: write

concurrency: stundenplan

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Kalender aus dem sPlan laden
        run: |
          mkdir -p data
          files=""
          n=0
          while IFS= read -r url; do
            url="$(echo "$url" | tr -d '[:space:]')"
            case "$url" in ''|'#'*) continue ;; esac
            n=$((n+1))
            out="data/stundenplan-$n.ics"
            if curl -fsSL --retry 3 --max-time 60 "$url" -o /tmp/plan.ics && grep -q 'BEGIN:VCALENDAR' /tmp/plan.ics; then
              # DTSTAMP ändert sich bei jedem Abruf und würde täglich einen Commit auslösen
              grep -v '^DTSTAMP' /tmp/plan.ics > "$out"
              echo "OK: $url ($(grep -c 'BEGIN:VEVENT' "$out") Termine)"
            else
              echo "::warning::Konnte $url nicht laden, alter Stand bleibt erhalten."
            fi
            [ -f "$out" ] && files="$files\"stundenplan-$n.ics\","
          done < stundenplan-url.txt
          echo "FILES=[${files%,}]" >> "$GITHUB_ENV"

      - name: Änderungen speichern
        run: |
          git add -A data
          if git diff --cached --quiet -- 'data/*.ics' && grep -q '"updated": "' data/stundenplan.json; then
            echo "Keine Änderungen im Stundenplan."
            exit 0
          fi
          printf '{ "updated": "%s", "files": %s }\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$FILES" > data/stundenplan.json
          git config user.name "Stundenplan-Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A data
          git commit -m "Stundenplan aktualisiert"
          git push
